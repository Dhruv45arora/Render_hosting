# Pings the live site every 10 minutes so Render free does not sleep.
# After push: GitHub → Actions → enable workflow if prompted.
name: Keep Render awake

on:
  schedule:
    # GitHub cron can drift a few minutes; 10-min interval is safer than 14+.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit health endpoint
        run: |
          set -e
          URL="${KEEP_AWAKE_URL:-https://aroracars.com/api/health}"
          echo "Pinging $URL"
          curl -fsS --max-time 90 "$URL"
          echo
          # Also touch homepage once so CDN/edge stays warm for visitors.
          curl -fsS --max-time 90 -o /dev/null -w "homepage:%{http_code}\n" "https://aroracars.com/"
